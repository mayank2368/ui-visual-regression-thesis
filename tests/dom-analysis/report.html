
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>DOM Analysis Report</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;
    margin:40px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#2c3e50;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#2c3e50;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

tr:nth-child(even){
    background:#f7f7f7;
}

.pass{
    color:green;
    font-weight:bold;
}

.fail{
    color:red;
    font-weight:bold;
}

.details{
    margin-top:40px;
}

ul{
    line-height:1.8;
}

</style>

</head>

<body>

<div class="container">

<h1>DOM/Layout Analysis Report</h1>

<p>

This report was automatically generated by the custom
DOM/Layout Analysis tool.

</p>

<table>

<thead>

<tr>

<th>Variant</th>
<th>Position</th>
<th>Size</th>
<th>Visibility</th>
<th>Status</th>

</tr>

</thead>

<tbody id="summary">

</tbody>

</table>

<div id="details" class="details">

</div>

</div>

<script>

fetch("results/index.json")

.then(r=>r.json())

.then(data=>{

const table=document.getElementById("summary");

const details=document.getElementById("details");

data.forEach(result=>{

table.innerHTML+=`

<tr>

<td>${result.variant}</td>

<td>${result.positionChanges}</td>

<td>${result.sizeChanges}</td>

<td>${result.visibilityChanges}</td>

<td class="${result.totalChanges>0?'fail':'pass'}">

${result.totalChanges>0?'FAIL':'PASS'}

</td>

</tr>

`;

details.innerHTML+=`

<h2>${result.variant}</h2>

<ul>

${
result.details.length
?
result.details.map(item=>`<li>${item}</li>`).join("")
:
"<li>No structural changes detected.</li>"
}

</ul>

<hr>

`;

});

});

</script>

</body>

</html>
